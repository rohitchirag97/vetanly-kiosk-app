buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Native libraries put their CMake build folders in node_modules/<long-name>/android/.cxx. Release builds there go past
// Windows' 260-character path limit (ninja then loops "build.ninja still dirty"), so keep them under a short folder instead.
subprojects { sub ->
    sub.plugins.withId("com.android.library") {
        sub.android.externalNativeBuild.cmake.buildStagingDirectory = new File(rootDir, "build/cxx/" + Integer.toHexString(sub.path.hashCode()))
    }
}
